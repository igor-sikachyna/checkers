syntax = "proto3";

package checkers.leaderboard;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "checkers/leaderboard/params.proto";
import "checkers/leaderboard/leaderboard.proto";

option go_package = "github.com/igor-sikachyna/checkers/x/leaderboard/types";

// Query defines the gRPC querier service.
service Query {
  
  // Parameters queries the parameters of the module.
  rpc Params (QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/igor-sikachyna/checkers/leaderboard/params";
  
  }
  
  // Queries a Leaderboard by index.
  rpc Leaderboard (QueryGetLeaderboardRequest) returns (QueryGetLeaderboardResponse) {
    option (google.api.http).get = "/igor-sikachyna/checkers/leaderboard/leaderboard";
  
  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  
  // params holds all the parameters of this module.
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QueryGetLeaderboardRequest {}

message QueryGetLeaderboardResponse {
  Leaderboard Leaderboard = 1 [(gogoproto.nullable) = false];
}

